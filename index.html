<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>這個家，要不要過臺灣？</title><style>
:root{--ink:#183c3b;--sea:#166e75;--paper:#fffaf0;--gold:#d99436}*{box-sizing:border-box}body{margin:0;background:#e9e4d8;color:var(--ink);font-family:system-ui,'Microsoft JhengHei',sans-serif;line-height:1.8}header{padding:22px max(5vw,20px);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #c9c8b8}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 20px;background:var(--sea);color:white;min-height:48px}button:hover{filter:brightness(1.12)}button:focus-visible{outline:3px solid #d99436;outline-offset:4px}button.secondary{background:#e3e9df;color:var(--ink)}main{max-width:950px;margin:auto;padding:32px 20px 60px}.eyebrow{font-size:13px;letter-spacing:3px;color:var(--sea);font-weight:700}h1{font-family:serif;font-size:clamp(32px,6vw,59px);line-height:1.3;margin:20px 0}h2{font-size:27px;line-height:1.4}h3{margin-top:0}.lead{font-size:19px;max-width:650px}.panel{background:var(--paper);padding:clamp(22px,4vw,40px);border-radius:22px;box-shadow:0 10px 40px #183c3b0a;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{border:1px solid #d9daca;border-radius:15px;padding:20px;background:#ffffff80}.card small{display:block;color:#67766a}.card strong{font-size:20px}.choices{display:grid;gap:12px}.choice{text-align:left;background:#fffaf0;color:var(--ink);border:1px solid #aebfb3;padding:20px}.choice b{display:block;font-size:20px}.choice span{display:block;font-size:15px;color:#526863;margin-top:5px}.note{font-size:14px;color:#657267}.tag{display:inline-block;background:#e3e9df;padding:3px 12px;border-radius:30px;font-size:13px}.sea{height:125px;position:relative;border-radius:20px;background:linear-gradient(170deg,#b8d9d3,#408b90);overflow:hidden;margin:26px 0}.sea:after{content:'～　～　～　～　～　～　～　～　～';position:absolute;bottom:8px;color:#e5f0df;font-size:35px;white-space:nowrap}.boat{position:absolute;left:45%;top:8px;font-size:65px}.progress{height:5px;background:#cdd4c8}.progress div{height:100%;background:var(--gold);transition:width .3s}.feedback{border-left:4px solid var(--gold);padding:14px 20px;background:#f3eddc;margin:20px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}details{margin-top:20px}summary{cursor:pointer}footer{font-size:12px;max-width:950px;margin:0 auto;padding:20px;color:#61736a}textarea{width:100%;font:inherit;padding:12px;min-height:110px;border:1px solid #aebfb3;border-radius:10px}@media(max-width:580px){.grid{grid-template-columns:1fr}header{font-size:13px}.panel{padding:22px}main{padding-top:20px}}@media print{header,button,footer,.progress{display:none}body{background:white}.panel{box-shadow:none;border:1px solid #ddd;break-inside:avoid}}
</style></head><body><header><strong>過臺灣｜家庭抉擇</strong><button class="secondary" onclick="teacher()">教師說明</button></header><div class="progress"><div id="bar"></div></div><main id="app" aria-live="polite"></main><footer>依使用者提供之翰林課本頁56–57設計。家庭、事件與結果為教學模擬，並非歷史統計；本遊戲不收集姓名或上傳作答。</footer><script>
const app=document.getElementById('app');let family=[],history=[],route='',event=null,answer='',quizIndex=0,quizResults=[],outcome='';
const categories=[['孩子',['沒有小孩，兩位成人共同生活。','有1名年幼小孩，需要成人照顧。','有3名小孩，最小的仍需照顧。','有5名小孩，其中2名能協助農務，吃飯的人也多。']],['田地',['有自己的小田，平時勉強夠吃，但無地分給下一代。','只有一小塊田，收成不夠全家吃。','租別人的田，收成後還要繳租。','沒有田地，靠替別人做工生活。']],['經濟',['有一些積蓄，能暫時應付生活。','收入剛好夠用，沒有多餘積蓄。','最近收成不好，存糧快用完。','家中欠債，需要持續尋找收入。']],['家人',['家人健康，成人能共同工作與照顧家庭。','有長者生病，需要有人留家照顧。','一位成人受傷，暫時無法工作。','只剩一位成人負責工作與照顧家庭。']],['親友',['親戚在臺灣，可暫時接待，但不保證有工作。','村裡有人去過臺灣，可向他詢問經驗。','只聽說臺灣很好賺，沒有熟人能證實。','臺灣沒有熟人，但原鄉親友願意暫時協助家人。']]];
const pick=a=>a[Math.floor(Math.random()*a.length)];function show(html,p){app.innerHTML=html;document.getElementById('bar').style.width=p+'%';window.scrollTo(0,0)}
function intro(){show('<div class="eyebrow">個人歷史情境遊戲 · 約5–8分鐘</div><h1>這個家，<br>要不要過臺灣？</h1><p class="lead">如果你住在清朝的沿海村莊，家裡的田不夠、米糧越來越少，你會留下，還是渡海尋找機會？</p><div class="sea" aria-hidden="true"><span class="boat">⛵</span></div><div class="panel"><h2>你替一個家庭作決定</h2><p>抽家庭背景 → 選擇去留 → 遇見變化 → 查看結果</p><p>沒有「一定正確」的路。請想想：誰需要被照顧？誰承擔風險？</p><button onclick="draw()">抽出我的家庭 →</button></div><p class="note">以課本中的清治前期情境為準：人口成長、耕地有限；渡臺須申請，且不准攜眷。清代不同時期的政策曾有變動。</p>',0)}
function familyHTML(){return '<div class="grid">'+family.map(f=>'<div class="card"><small>'+f[0]+'</small><strong>'+f[1]+'</strong></div>').join('')+'</div>'}
function draw(){family=categories.map(([a,b])=>[a,pick(b)]);history=[];quizResults=[];quizIndex=0;show('<div class="eyebrow">01 / 你的出身</div><h2>這就是你要照顧的家</h2>'+familyHTML()+'<div class="feedback">帶著這些條件作選擇。下一步，你將決定這個家的去留。</div><button onclick="decision(false)">開始家庭抉擇 →</button>',15)}
const labels={stay:'留在原鄉',apply:'申請渡臺',secret:'冒險偷渡'};
function decision(second){show('<div class="eyebrow">'+(second?'03 / 再次抉擇':'02 / 第一次抉擇')+'</div><h2>'+(second?'消息改變了，你的決定呢？':'你會替這個家選哪一條路？')+'</h2>'+(second?'<div class="feedback">'+event+'</div>':'<p>課本說：原鄉人口成長、耕地有限；臺灣適合水稻生長，但渡臺須申請，且不准攜眷。</p>')+'<details><summary>查看我的家庭</summary>'+familyHTML()+'</details><div class="choices" style="margin-top:20px">'+[['stay','可以照顧家人，依靠原有親友；生計困難仍可能存在。'],['apply','依規定申請，但要等待；本課情境下，不能全家同行。'],['secret','未經許可出發；面臨查緝、受騙與渡海風險。']].map(([v,d])=>'<button class="choice" onclick="reason(\''+v+'\','+second+')"><b>'+labels[v]+'</b><span>'+d+'</span></button>').join('')+'</div>',second?52:28)}
function reason(v,second){route=v;let options=v==='stay'?['家人需要照顧，我想先留下。','還能依靠田地或親友，我想先維持生活。','我擔心海上風險與抵臺後的不確定。']:v==='apply'?['我想尋找生計，也希望依規定辦理。','我願意等待申請，但擔心留下的家人。','臺灣有親友或工作消息，我想試著爭取機會。']:['家裡的生活壓力大，我覺得不能再等。','我想和家人同行，但本課中的規定不允許。','我相信臺灣的機會，願意承擔風險。'];show('<span class="tag">你選擇：'+labels[v]+'</span><h2>最接近你想法的理由是？</h2><p>請對照你抽到的家庭，選出最符合的一項。</p><div class="choices">'+options.map((x,i)=>'<button class="choice" onclick="record('+second+','+i+')">'+x+'</button>').join('')+'</div><details><summary>查看我的家庭</summary>'+familyHTML()+'</details>',second?60:35);answer=options}
function record(second,i){history.push({route:labels[route],reason:answer[i]});if(second)result();else{event=pick(['收成減少了。家裡的米糧比原本預期更快用完，眼前的生活更加吃緊。','家中長者病倒了，需要有人照顧。若有人出發，留下的人能否承擔？','親友介紹了一份短工，暫時能增加收入，但不確定能做多久。','傳來消息：有人在臺灣找到生計，也有人一直找不到工作。你才發現消息並不完整。','村裡傳來一艘渡臺船遭遇風浪的消息。無論是否取得許可，渡海都可能有危險。']);show('<div class="eyebrow">生活並不照計畫走</div><h2>一封新的消息</h2><div class="panel"><p class="lead">'+event+'</p></div><p>你可以維持原本的選擇，也可以改變。改變想法不會扣分。</p><button onclick="decision(true)">再作一次決定 →</button>',45)}}
function result(){const outcomes={stay:['你找到暫時的工作，家人可以相互照顧。但田地不足與下一代的生計問題仍需要處理。','你留在家鄉照顧家人，但收入仍不穩定。你開始向親友尋找其他工作機會。'],apply:['你獲准渡臺，卻必須與家人分開。平安上岸後，你仍要找工作、住處，想辦法支持留下的家人。','申請仍在等待，家庭資源持續消耗。你需要一邊維持生活，一邊重新評估計畫。','你獲准出發，但途中遇到風浪，部分物資損失。取得許可並不會消除海上危險。'],secret:['你平安抵臺，但找不到原先聽說的工作。住處、糧食與家人的生活都還沒有著落。','船戶臨時索取更多費用，途中又遇風浪。行李有所損失，你必須設法求助。','你在渡臺過程中遭官府查獲，計畫中止，並面臨處罰或遣返。']};outcome=pick(outcomes[route]);show('<div class="eyebrow">04 / 選擇之後</div><h2>你的故事，暫時走到這裡</h2><span class="tag">'+labels[route]+'</span><div class="panel"><p class="lead">'+outcome+'</p></div><div class="feedback">這是模擬的一種可能，不是真實發生機率。順利的結果不代表選擇一定正確；困難的結果也不代表你當時沒有認真思考。</div><button onclick="quiz()">兩題小挑戰 →</button>',74)}
const questions=[{q:'為什麼有人明知危險，仍想渡臺？',a:['因為每個人都知道去臺灣一定致富。','原鄉生計困難，加上對臺灣工作與農耕機會的期待。','因為當時所有家庭都沒有田地。'],ok:1,ex:'課本提到人口成長、耕地有限與米糧不足，也提到臺灣適合水稻生長。這些因素會影響人們的期待，但不保證成功。'},{q:'依照本課情境，「不准攜眷」最可能帶來什麼兩難？',a:['想找新生計，卻要面對與家人分離及照顧安排。','只要申請成功，就不再需要照顧家人。','只要選擇偷渡，全家就一定能安全抵臺。'],ok:0,ex:'政策限制與家庭責任會相互拉扯。留下、申請或偷渡都可能有代價；合法渡臺也仍有渡海與謀生風險。'}];
function quiz(){let q=questions[quizIndex];show('<div class="eyebrow">05 / 課本小挑戰 '+(quizIndex+1)+' / 2</div><h2>'+q.q+'</h2><div class="choices">'+q.a.map((a,i)=>'<button class="choice" onclick="check('+i+')">'+a+'</button>').join('')+'</div>',82+quizIndex*6)}
function check(i){let q=questions[quizIndex],correct=i===q.ok;quizResults.push(correct);show('<h2>'+(correct?'你掌握了這個重點！':'換個角度想一想')+'</h2><div class="feedback">'+q.ex+'</div><p>較合適的回答：'+q.a[q.ok]+'</p><button onclick="nextQuiz()">'+(quizIndex===0?'下一題 →':'查看我的選擇回顧 →')+'</button>',88+quizIndex*5)}
function nextQuiz(){quizIndex++;if(quizIndex<2)quiz();else report()}
function report(){show('<div class="eyebrow">完成 / 我的選擇回顧</div><h2>條件不同，選擇也可能不同</h2>'+familyHTML()+'<div class="panel"><h3>你的決策足跡</h3>'+history.map((h,i)=>'<p><b>'+['最初','消息傳來後'][i]+'：'+h.route+'</b><br>'+h.reason+'</p>').join('')+'<p><b>遇到的變化：</b>'+event+'</p><p><b>模擬結果：</b>'+outcome+'</p></div><div class="feedback">你已完成2題課本挑戰，首次答對'+quizResults.filter(Boolean).length+'題。<br>理解重點：原鄉的生活壓力、對臺灣的期待、渡臺限制與家庭責任，共同影響移民決定。</div><p><b>再想一想：</b>如果家裡有更多田地或有人能照顧家人，你還會作同樣選擇嗎？臺灣並非無主之地，抵臺後取得耕地也涉及原住民族既有的生活領域與權利。</p><div class="actions"><button onclick="window.print()">列印／存成PDF</button><button class="secondary" onclick="download()">下載我的回顧</button><button class="secondary" onclick="intro()">重新體驗</button></div>',100)}
function download(){let text='這個家，要不要過臺灣？\n\n'+family.map(f=>f.join('：')).join('\n')+'\n\n'+history.map((h,i)=>(i+1)+'. '+h.route+'：'+h.reason).join('\n')+'\n變化：'+event+'\n結果：'+outcome+'\n\n家庭與事件為教學模擬，不代表歷史統計。';let url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='我的渡臺選擇回顧.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function teacher(){let d=document.createElement('dialog');d.style.cssText='max-width:650px;border:0;border-radius:20px;padding:30px;color:#183c3b';d.innerHTML='<h2>給老師的快速使用說明</h2><p>學生個別操作，約5～8分鐘；不用分組討論。流程包含家庭抽籤、兩次決策、模擬結果、兩題自動回饋與個人回顧。</p><p>請學生完成後截圖回顧，或下載文字回顧，再交到既有的班級平台。本遊戲沒有教師後台，不會自動收集全班答案；重新整理將重設本次進度。</p><p>不以抵臺或致富計分。只有知識題提供答題回饋，決策選項不判對錯。家庭、事件均為虛構教學設定，各選項不代表史實比例。</p><p>背景依提供的課本頁56–57；政策曾隨時間調整，本遊戲沒有把整個清代當成同一套固定規則。</p><button id="closeDialog">回到遊戲</button>';document.body.appendChild(d);d.querySelector('button').onclick=()=>{d.close();d.remove()};d.addEventListener('cancel',()=>d.remove());d.showModal()}
intro();
</script></body></html>
