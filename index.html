<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>這個家，要不要過臺灣？</title><style>
:root{--ink:#183c3b;--sea:#166e75;--paper:#fffaf0;--gold:#d99436}*{box-sizing:border-box}body{margin:0;background:#e9e4d8;color:var(--ink);font-family:system-ui,'Microsoft JhengHei',sans-serif;line-height:1.8}header{padding:22px max(5vw,20px);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #c9c8b8}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 20px;background:var(--sea);color:white;min-height:48px}button:hover{filter:brightness(1.12)}button:focus-visible{outline:3px solid #d99436;outline-offset:4px}button.secondary{background:#e3e9df;color:var(--ink)}main{max-width:950px;margin:auto;padding:32px 20px 60px}.eyebrow{font-size:13px;letter-spacing:3px;color:var(--sea);font-weight:700}h1{font-family:serif;font-size:clamp(32px,6vw,59px);line-height:1.3;margin:20px 0}h2{font-size:27px;line-height:1.4}h3{margin-top:0}.lead{font-size:19px;max-width:650px}.panel{background:var(--paper);padding:clamp(22px,4vw,40px);border-radius:22px;box-shadow:0 10px 40px #183c3b0a;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{border:1px solid #d9daca;border-radius:15px;padding:20px;background:#ffffff80}.card small{display:block;color:#67766a}.card strong{font-size:20px}.choices{display:grid;gap:12px}.choice{text-align:left;background:#fffaf0;color:var(--ink);border:1px solid #aebfb3;padding:20px}.choice b{display:block;font-size:20px}.choice span{display:block;font-size:15px;color:#526863;margin-top:5px}.note{font-size:14px;color:#657267}.tag{display:inline-block;background:#e3e9df;padding:3px 12px;border-radius:30px;font-size:13px}.sea{height:125px;position:relative;border-radius:20px;background:linear-gradient(170deg,#b8d9d3,#408b90);overflow:hidden;margin:26px 0}.sea:after{content:'～　～　～　～　～　～　～　～　～';position:absolute;bottom:8px;color:#e5f0df;font-size:35px;white-space:nowrap}.boat{position:absolute;left:45%;top:8px;font-size:65px}.progress{height:5px;background:#cdd4c8}.progress div{height:100%;background:var(--gold);transition:width .3s}.feedback{border-left:4px solid var(--gold);padding:14px 20px;background:#f3eddc;margin:20px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}details{margin-top:20px}summary{cursor:pointer}footer{font-size:12px;max-width:950px;margin:0 auto;padding:20px;color:#61736a}textarea{width:100%;font:inherit;padding:12px;min-height:110px;border:1px solid #aebfb3;border-radius:10px}@media(max-width:580px){.grid{grid-template-columns:1fr}header{font-size:13px}.panel{padding:22px}main{padding-top:20px}}@media print{header,button,footer,.progress{display:none}body{background:white}.panel{box-shadow:none;border:1px solid #ddd;break-inside:avoid}}
.steps{display:flex;gap:12px;flex-wrap:wrap;font-size:20px;font-weight:700}.steps span{background:#fffaf0;padding:12px 18px;border-radius:12px}.big-icon{font-size:54px;line-height:1.3;margin-bottom:12px}.speech{background:#e1ebe1;border-radius:18px;padding:22px;margin:22px 0;font-size:20px}.speech p{margin:10px 0 0}.risks{text-align:center}.risks p{font-size:21px}.choices{margin-top:20px}.choice{font-size:20px}.story-path{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.family-grid .card{padding:18px}.family-grid small{font-size:17px;margin-bottom:8px}p.lead{font-size:23px}.story-path p{margin-bottom:0}@media(max-width:580px){.risks{grid-template-columns:1fr 1fr}.risks .card{padding:16px 10px}.risks h3{font-size:19px}.story-path{grid-template-columns:1fr}.speech{font-size:19px}.big-icon{font-size:44px}} </style></head><body><header><strong>過臺灣｜家庭抉擇</strong><button class="secondary" onclick="teacher()">教師說明</button></header><div class="progress"><div id="bar"></div></div><main id="app" aria-live="polite"></main><footer>教學故事，抽籤結果不代表歷史比例。｜不收集姓名與作答</footer><script>
const app=document.getElementById('app');
let family=[],history=[],route='',event='',answer=[],quizIndex=0,quizResults=[],outcome='',journey=[],familyImpact='',departed=false;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const categories=[['孩子',['沒有小孩','1個小孩，還需要人照顧','3個小孩，最小的還很小','5個小孩，2個能幫忙種田']],['田地',['有一小塊田，收成剛好夠吃','田太少，收成不夠吃','租田種，收成要分給地主','沒有田，靠做工賺錢']],['經濟',['有存款，還能撐一陣子','錢剛好夠用，沒有存款','收成不好，米快吃完了','欠了錢，還沒辦法還']],['家人',['家人健康，能一起工作','長輩生病，需要人照顧','一位家人受傷，不能工作','能工作的人少，家裡很忙']],['親友',['臺灣有親戚，可以暫住','村裡有人去過臺灣，可以問他','只聽說臺灣好賺，不知道真假','臺灣沒熟人，家鄉有人能幫忙']]];
const labels={stay:'留在原鄉',apply:'申請渡臺',secret:'冒險偷渡'};
function show(html,p){app.innerHTML=html;document.getElementById('bar').style.width=p+'%';window.scrollTo(0,0)}
function btn(text,fn,secondary=false){return '<button'+(secondary?' class="secondary"':'')+' onclick="'+fn+'">'+text+'</button>'}
function familyHTML(){const icons=['👧','🌾','🪙','👪','✉️'];return '<div class="grid family-grid">'+family.map((f,i)=>'<div class="card"><small>'+icons[i]+' '+f[0]+'</small><strong>'+f[1]+'</strong></div>').join('')+'</div>'}
function sources(){return '<details><summary>史料與遊戲設定</summary><p>家庭、事件和對話皆為虛構情境，並非人物傳記。隨機抽卡為教學安排，不代表實際死亡率、疾病率或男女比例。「六死三留一回頭」等俗諺不能換算成統計數據。</p><p>本次以課本所述清治前期限制攜眷的情境為準；不同年代的政策與執行情形曾有變動。漢人女性渡臺較男性少，並非沒有女性渡臺；也不能忽略原本就在臺灣的原住民族女性。</p><ul><li><a href="https://women.nmth.gov.tw/?page_id=1444" target="_blank" rel="noopener">國立臺灣歷史博物館：臺灣女人大事記</a></li><li><a href="https://storystudio.tw/article/gushi/smuggled-to-taiwan" target="_blank" rel="noopener">故事：清代移民的渡海與偷渡風險</a></li><li><a href="https://file.moc.gov.tw/001/Upload/528/relfile/13675/218883/3bcde012-0e70-4f2b-adda-848d6ae382bd.pdf" target="_blank" rel="noopener">《歷史臺灣》27期：疾病史研究</a></li></ul><p>疾病情境中的發燒、腹瀉不能單憑症狀確診；文獻所稱「瘴癘」也不等於某一種疾病。</p></details>'}
function intro(){show('<div class="eyebrow">五年級短句版 · 約5–7分鐘</div><h1>這個家，<br>要不要過臺灣？</h1><p class="lead">家裡的飯不夠吃。<br>聽說臺灣有機會，你要去嗎？</p><div class="sea" aria-hidden="true"><span class="boat">⛵</span></div><div class="steps"><span>🎲 抽家庭</span><span>🤔 做選擇</span><span>🌊 看遭遇</span></div><div class="actions">'+btn('🎲 抽出我的家庭','draw()')+'</div><p class="note">故事會提到生病和死亡，沒有可怕的圖片。</p>',0)}
function draw(){family=categories.map(([k,v])=>[k,pick(v)]);history=[];journey=[];quizResults=[];quizIndex=0;outcome='';familyImpact='';departed=false;show('<div class="eyebrow">🎲 我的家庭</div><h2>這就是你的家</h2>'+familyHTML()+'<div class="speech"><b>👨 這次，家裡一位成年男子想去臺灣。</b><p>👩 家人說：「你走了，誰幫忙賺錢、照顧大家？」</p></div><p class="note">當時渡臺的漢人男性較多，但也有女性渡臺。</p>'+btn('替家人做決定 →','decision(false)'),12)}
function decision(second){let descriptions=[['stay','🏠','留在家鄉，和家人一起想辦法。'],['apply','📜','先向官府申請。本次不能帶家人。'],['secret','⛵','不經官府同意，冒險搭船去。']];show('<div class="eyebrow">🤔 '+(second?'再想一次':'你的選擇')+'</div><h2>'+(second?'現在，你想怎麼選？':'你想怎麼做？')+'</h2>'+(second?'<div class="feedback">'+event+'</div>':'<p>家鄉人多、田少。臺灣可能有工作，但不一定找得到。</p>')+'<details><summary>👪 看看我的家庭</summary>'+familyHTML()+'</details><div class="choices">'+descriptions.map(([v,icon,d])=>'<button class="choice" onclick="reason(\''+v+'\','+second+')"><b>'+icon+' '+labels[v]+'</b><span>'+d+'</span></button>').join('')+'</div>',second?35:22)}
function reason(v,second){route=v;answer=v==='stay'?['我要留下照顧家人。','家裡還能撐下去。','我怕再也見不到家人。']:v==='apply'?['我想找工作，也想照規定來。','我願意等，先安排好家人。','我想試試，但知道還是有危險。']:['家裡快沒飯吃，不能再等。','申請不容易，我還是想去。','我想冒險，但也很害怕。'];show('<span class="tag">'+labels[v]+'</span><h2>你為什麼這樣選？</h2><div class="choices">'+answer.map((s,i)=>'<button class="choice" onclick="record('+second+','+i+')">'+s+'</button>').join('')+'</div><details><summary>👪 看看我的家庭</summary>'+familyHTML()+'</details>',second?40:26)}
function record(second,i){history.push({route:labels[route],reason:answer[i]});if(second){riskGate();return}event=pick(['🌾 收成不好，家裡的米快吃完了！','🤒 長輩病倒了。誰來照顧？誰去賺錢？','🛠️ 親友找到一份工作，但只能做幾天。','🌊 聽說一艘船翻了，有人淹死、有人失蹤。','✉️ 臺灣來信：有人病倒，沒辦法工作賺錢。']);show('<div class="eyebrow">✉️ 村裡傳來消息</div><h2>事情變了！</h2><div class="panel"><p class="lead">'+event+'</p></div>'+btn('再選一次 →','decision(true)'),30)}
function riskGate(){show('<div class="eyebrow">⚠️ 出發前</div><h2>這一去，可能回不來</h2><div class="grid risks"><div class="card"><div class="big-icon">🌊</div><h3>船可能翻覆</h3><p>落水、失蹤，<br>甚至淹死。</p></div><div class="card"><div class="big-icon">🤒</div><h3>上岸也可能生病</h3><p>沒力氣工作，<br>病重可能死亡。</p></div></div><div class="speech">👪「如果你回不來，家裡怎麼辦？」</div><p>有官府許可，也不保證安全。</p><div class="actions">'+btn(route==='stay'?'🏠 我決定留下':'⛵ 我還是要去','proceed()')+(route==='stay'?'':btn('🏠 我改變心意，留下','changeStay()',true))+'</div><p class="note">遊戲中的抽籤，不是當時的死亡率。</p>',48)}
function changeStay(){route='stay';history.push({route:labels.stay,reason:'想到可能回不來，我決定留下。'});proceed()}
function proceed(){if(route==='stay'){outcome=pick(['你留下做工，賺到一些錢。但工作不穩定，田也不夠。','你留下來，卻遇到家人生病。要工作，也要照顧家人。']);familyImpact='一家人能互相照顧，但吃飯、賺錢還是難題。';ending();return}if(route==='apply'){let status=pick(['granted','granted','waiting']);if(status==='waiting'){outcome='申請還沒通過。你一邊等消息，一邊找工作。家裡的錢越來越少。';familyImpact='等待的日子裡，家人還是要吃飯、工作。';ending();return}}departed=true;voyage()}
const seaCards=[{name:'⛵ 平安到岸',text:'船在大浪中搖晃。你很害怕，也很累，幸好平安到了臺灣。',state:'landed'},{name:'💧 又渴又難受',text:'船走了很久，水快喝完了。你一直吐，到了臺灣也沒力氣工作。',state:'landed'},{name:'🌫️ 船難：失蹤',text:'船遇上大風浪。出海的男子失蹤了，家人不知道他在哪裡，也不知道他是否平安。',state:'missing'},{name:'🌊 船難：死亡',text:'大浪把船打翻了。出海的男子落水淹死，再也不能回家。',state:'dead'}];
function voyage(){let cards=route==='secret'?seaCards.concat([{name:'🚫 偷渡被發現',text:'官府發現你偷渡，你可能受罰、被送回去。船錢也可能拿不回來。',state:'stopped'},{name:'💰 船家多收錢',text:'船家半路又要錢。你到了臺灣，身上的錢卻快用光了。',state:'landed'}]):seaCards;let card=pick(cards);journey.push('渡海｜'+card.name+'：'+card.text);show('<div class="eyebrow">05 / 航程事件 · '+labels[route]+'</div><h2>'+card.name+'</h2><div class="panel"><p class="lead">'+card.text+'</p></div><p class="note">這是故事中的一次遭遇，不代表每次出海都一樣。</p>'+btn(card.state==='landed'?'上岸之後 →':'看看家人怎麼了 →',"afterSea('"+card.state+"')"),60)}
function afterSea(state){if(state==='landed'){illness();return}outcome=journey[journey.length-1];familyImpact=state==='dead'?'家人很難過。少了一個人，賺錢、種田、照顧孩子的事還是要做。':state==='missing'?'家人一直等消息，也要想辦法賺錢、照顧彼此。':'船錢花了，家裡還是得想辦法過日子。';ending()}
function illness(){show('<div class="eyebrow">🤒 到了臺灣</div><h2>上岸了，卻病倒了</h2><div class="panel"><div class="big-icon">🛏️</div><p class="lead">你發燒、全身沒力。<br>不能工作，錢卻快花完了。</p></div><h3>你最擔心什麼？</h3><div class="choices">'+['🩺 找不到大夫，也沒人照顧我。','🪙 不能賺錢，家人怎麼辦？','👪 好想家人，卻見不到他們。'].map((t,i)=>'<button class="choice" onclick="illnessOutcome('+i+')">'+t+'</button>').join('')+'</div>',69)}
function illnessOutcome(i){const worries=['沒有人照顧，也找不到大夫','不能賺錢，家人怎麼辦','想念家人，卻沒辦法見面'];journey.push('病倒時最擔心｜'+worries[i]);let health=pick([{name:'🛏️ 還要休養',text:'你的病慢慢好轉，但還要休息。沒辦法工作，錢卻一天天花掉。'},{name:'🤒 一直好不了',text:'你病了很久，不能工作。吃飯、住處要花錢，也沒錢寄回家。'},{name:'🕯️ 病重死亡',text:'這位男子病得很重，最後過世了。到了臺灣，仍沒能和家人再見面。'}]);journey.push('抵臺後｜'+health.name+'：'+health.text);outcome=health.text;familyImpact=health.name==='🕯️ 病重死亡'?'家人失去了親人。難過之餘，還要想辦法繼續生活。':'家人等不到錢，只好再找工作、互相幫忙。';ending()}
function ending(){show('<div class="eyebrow">📖 故事的後來</div><h2>後來，這個家……</h2><div class="panel"><span class="tag">'+labels[route]+'</span><p class="lead">'+outcome+'</p></div><div class="speech"><h3>👪 留在家鄉的人</h3><p>'+familyImpact+'</p></div>'+btn('看我的故事回顧 →','report()'),78)}
const questions=[{q:'為什麼有人明知危險，還是想去臺灣？',a:['家裡快沒飯吃，想找新工作。','去了臺灣，一定能發財。','當時的人都不怕死。'],ok:0,ex:'想讓家人過得好，卻也怕再也回不來。'},{q:'當時，女性也會渡臺嗎？',a:['臺灣根本沒有女性。','會，但漢人女性移民比男性少。','整個清代，從來沒有女性渡臺。'],ok:1,ex:'有女性渡臺。留在家鄉的女性，也要工作、照顧家人。'},{q:'拿到官府許可，上岸後就安全了嗎？',a:['對，只要努力就不會生病。','不一定，還可能生病或沒工作。','只有偷渡的人會生病。'],ok:1,ex:'平安上岸後，還有生活和健康的難關。'}];
function quiz(){let q=questions[quizIndex];show('<div class="eyebrow">08 / 小挑戰 '+(quizIndex+1)+' / '+questions.length+'</div><h2>'+q.q+'</h2><div class="choices">'+q.a.map((s,i)=>'<button class="choice" onclick="check('+i+')">'+s+'</button>').join('')+'</div>',82+quizIndex*4)}
function check(i){let q=questions[quizIndex];quizResults.push(i===q.ok);show('<h2>'+(i===q.ok?'答對了！':'再想一想')+'</h2><div class="feedback">'+q.ex+'</div><p>較合適的回答：'+q.a[q.ok]+'</p>'+btn(quizIndex<questions.length-1?'下一題 →':'查看我的選擇回顧 →','nextQuiz()'),85+quizIndex*4)}
function nextQuiz(){quizIndex++;quizIndex<questions.length?quiz():report()}
function report(){show('<div class="eyebrow">📖 我的故事回顧</div><h2>如果這是你的家……</h2><div class="story-path">'+history.map((h,i)=>'<div class="card"><small>第'+(i+1)+'次選擇</small><strong>'+labelsIcon(h.route)+' '+h.route+'</strong><p>'+h.reason+'</p></div>').join('')+'</div><div class="panel"><h3>最後發生了什麼？</h3><p>'+outcome+'</p><h3>👪 家人呢？</h3><p>'+familyImpact+'</p></div><div class="feedback">💬 如果田多一點、錢多一點，你還會這樣選嗎？</div>'+(quizResults.length?'<p>小挑戰首次答對'+quizResults.filter(Boolean).length+'題。</p>':'')+'<div class="actions">'+btn('📷 留下這一頁，回課堂分享','saveHint()')+btn('🎲 再玩一次','intro()',true)+'</div><details><summary>其他功能</summary><div class="actions">'+btn('下載故事','download()',true)+btn('列印','window.print()',true)+(quizResults.length?'':btn('三題小挑戰','startQuiz()',true))+'</div></details>',100)}
function labelsIcon(v){return v===labels.stay?'🏠':v===labels.apply?'📜':'⛵'}
function startQuiz(){quizIndex=0;quizResults=[];quiz()}
function saveHint(){let n=document.getElementById('save-hint');if(!n){n=document.createElement('p');n.id='save-hint';n.className='feedback';n.textContent='請用平板的截圖功能，留下這一頁。';app.appendChild(n)}}
function download(){let text='這個家，要不要過臺灣？五年級短句版\n\n'+family.map(f=>f.join('：')).join('\n')+'\n\n'+history.map((h,i)=>(i+1)+'. '+h.route+'：'+h.reason).join('\n')+'\n變化：'+event+'\n'+journey.join('\n')+'\n結果：'+outcome+'\n留鄉家人：'+familyImpact+'\n\n隨機事件為教學模擬，不代表歷史機率。';let u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='我的渡臺選擇回顧.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function teacher(){let d=document.createElement('dialog');d.style.cssText='max-width:700px;border:0;border-radius:20px;padding:30px;color:#183c3b;max-height:85vh;overflow:auto';d.innerHTML='<h2>五年級短句版｜教師說明</h2><p>約5～7分鐘，個別點選；長篇史料留在此處，知識題改為選做。新增出發前死亡與疾病風險、海難死亡／失蹤、抵臺後疾病與家庭後果。採非血腥文字；事件不作輸贏評分，任何結局都能完成知識題。</p><p>本次以成年男子考慮渡臺、其他家人留鄉為情境。清治前期漢人女性移民較少，並非無女性渡臺；女性也是勞動與家庭決策者。不同時期政策與執行曾變動。</p><p><b>抽卡不是死亡率：</b>所有學生出發前都會閱讀生命風險；實際事件隨機呈現。不可依抽卡次數推估史實比例，也不以俗諺設定百分比。疾病關卡為教學上刻意聚焦的情境，不代表抵臺者必然生病。</p><p>留鄉也有貧困與疾病壓力。遊戲不暗示留鄉保證安全、合法渡臺保證安全，或努力就能避免事故。支持與醫療不能被寫成保證治癒的按鈕。</p><p>完成後可截圖或下載回顧交至既有班級平台。不收集姓名、不自動傳送作答，重新整理會重設進度。</p>'+sources()+btn('回到遊戲','this.closest(\'dialog\').close()');d.addEventListener('close',()=>d.remove());document.body.appendChild(d);d.showModal()}
