<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>這個家，要不要過臺灣？</title><style>
:root{--ink:#183c3b;--sea:#166e75;--paper:#fffaf0;--gold:#d99436}*{box-sizing:border-box}body{margin:0;background:#e9e4d8;color:var(--ink);font-family:system-ui,'Microsoft JhengHei',sans-serif;line-height:1.8}header{padding:22px max(5vw,20px);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #c9c8b8}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 20px;background:var(--sea);color:white;min-height:48px}button:hover{filter:brightness(1.12)}button:focus-visible{outline:3px solid #d99436;outline-offset:4px}button.secondary{background:#e3e9df;color:var(--ink)}main{max-width:950px;margin:auto;padding:32px 20px 60px}.eyebrow{font-size:13px;letter-spacing:3px;color:var(--sea);font-weight:700}h1{font-family:serif;font-size:clamp(32px,6vw,59px);line-height:1.3;margin:20px 0}h2{font-size:27px;line-height:1.4}h3{margin-top:0}.lead{font-size:19px;max-width:650px}.panel{background:var(--paper);padding:clamp(22px,4vw,40px);border-radius:22px;box-shadow:0 10px 40px #183c3b0a;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{border:1px solid #d9daca;border-radius:15px;padding:20px;background:#ffffff80}.card small{display:block;color:#67766a}.card strong{font-size:20px}.choices{display:grid;gap:12px}.choice{text-align:left;background:#fffaf0;color:var(--ink);border:1px solid #aebfb3;padding:20px}.choice b{display:block;font-size:20px}.choice span{display:block;font-size:15px;color:#526863;margin-top:5px}.note{font-size:14px;color:#657267}.tag{display:inline-block;background:#e3e9df;padding:3px 12px;border-radius:30px;font-size:13px}.sea{height:125px;position:relative;border-radius:20px;background:linear-gradient(170deg,#b8d9d3,#408b90);overflow:hidden;margin:26px 0}.sea:after{content:'～　～　～　～　～　～　～　～　～';position:absolute;bottom:8px;color:#e5f0df;font-size:35px;white-space:nowrap}.boat{position:absolute;left:45%;top:8px;font-size:65px}.progress{height:5px;background:#cdd4c8}.progress div{height:100%;background:var(--gold);transition:width .3s}.feedback{border-left:4px solid var(--gold);padding:14px 20px;background:#f3eddc;margin:20px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}details{margin-top:20px}summary{cursor:pointer}footer{font-size:12px;max-width:950px;margin:0 auto;padding:20px;color:#61736a}textarea{width:100%;font:inherit;padding:12px;min-height:110px;border:1px solid #aebfb3;border-radius:10px}@media(max-width:580px){.grid{grid-template-columns:1fr}header{font-size:13px}.panel{padding:22px}main{padding-top:20px}}@media print{header,button,footer,.progress{display:none}body{background:white}.panel{box-shadow:none;border:1px solid #ddd;break-inside:avoid}}
</style></head><body><header><strong>過臺灣｜家庭抉擇</strong><button class="secondary" onclick="teacher()">教師說明</button></header><div class="progress"><div id="bar"></div></div><main id="app" aria-live="polite"></main><footer>依使用者提供之翰林課本頁56–57設計。家庭、事件與結果為教學模擬，並非歷史統計；本遊戲不收集姓名或上傳作答。</footer><script>
const app=document.getElementById('app');
let family=[],history=[],route='',event='',answer=[],quizIndex=0,quizResults=[],outcome='',journey=[],familyImpact='',departed=false;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const categories=[['孩子',['沒有小孩，家中仍有親人需要互相照顧。','有1名年幼小孩，需要成人照顧。','有3名小孩，最小的仍需照顧。','有5名小孩，其中2名能協助農務，吃飯的人也多。']],['田地',['有自己的小田，平時勉強夠吃，但無地分給下一代。','只有一小塊田，收成不夠全家吃。','租別人的田，收成後還要繳租。','沒有田地，靠替別人做工生活。']],['經濟',['有一些積蓄，能暫時應付生活。','收入剛好夠用，沒有多餘積蓄。','最近收成不好，存糧快用完。','家中欠債，需要持續尋找收入。']],['家人',['家人健康，能共同工作與照顧家庭。','有長者生病，需要有人留家照顧。','一位家人受傷，暫時無法工作。','能工作的家人不多，收入與照顧責任都很吃重。']],['親友',['親戚在臺灣，可暫時接待，但不保證有工作。','村裡有人去過臺灣，可向他詢問經驗。','只聽說臺灣很好賺，沒有熟人能證實。','臺灣沒有熟人，但原鄉親友願意暫時協助家人。']]];
const labels={stay:'留在原鄉',apply:'申請渡臺',secret:'冒險偷渡'};
function show(html,p){app.innerHTML=html;document.getElementById('bar').style.width=p+'%';window.scrollTo(0,0)}
function btn(text,fn,secondary=false){return '<button'+(secondary?' class="secondary"':'')+' onclick="'+fn+'">'+text+'</button>'}
function familyHTML(){return '<div class="grid">'+family.map(f=>'<div class="card"><small>'+f[0]+'</small><strong>'+f[1]+'</strong></div>').join('')+'</div>'}
function sources(){return '<details><summary>史料與遊戲設定</summary><p>家庭、事件和對話皆為虛構情境，並非人物傳記。隨機抽卡為教學安排，不代表實際死亡率、疾病率或男女比例。「六死三留一回頭」等俗諺不能換算成統計數據。</p><p>本次以課本所述清治前期限制攜眷的情境為準；不同年代的政策與執行情形曾有變動。漢人女性渡臺較男性少，並非沒有女性渡臺；也不能忽略原本就在臺灣的原住民族女性。</p><ul><li><a href="https://women.nmth.gov.tw/?page_id=1444" target="_blank" rel="noopener">國立臺灣歷史博物館：臺灣女人大事記</a></li><li><a href="https://storystudio.tw/article/gushi/smuggled-to-taiwan" target="_blank" rel="noopener">故事：清代移民的渡海與偷渡風險</a></li><li><a href="https://file.moc.gov.tw/001/Upload/528/relfile/13675/218883/3bcde012-0e70-4f2b-adda-848d6ae382bd.pdf" target="_blank" rel="noopener">《歷史臺灣》27期：疾病史研究</a></li></ul><p>疾病情境中的發燒、腹瀉不能單憑症狀確診；文獻所稱「瘴癘」也不等於某一種疾病。</p></details>'}
function intro(){show('<div class="eyebrow">第二版 · 個人情境遊戲 · 約7–10分鐘</div><h1>這個家，<br>要不要過臺灣？</h1><p class="lead">渡海可能帶來生計，也可能讓家人再也無法相見。你願意承擔什麼？留下的人又會面對什麼？</p><div class="sea" aria-hidden="true"><span class="boat">⛵</span></div><div class="panel"><h2>一家人的決定，不只是誰上船</h2><p>抽家庭 → 決定去留 → 出發前再想一次 → 海上與抵臺後的遭遇 → 家庭回顧</p><p>故事會提及船難、死亡與疾病，不使用血腥畫面，也不以存活或致富評分。</p>'+btn('抽出我的家庭 →','draw()')+'</div><p class="note">以課本的清治前期限制攜眷情境為準。遊戲的隨機結果不是歷史發生機率。</p>'+sources(),0)}
function draw(){family=categories.map(([k,v])=>[k,pick(v)]);history=[];journey=[];quizResults=[];quizIndex=0;outcome='';familyImpact='';departed=false;show('<div class="eyebrow">01 / 家庭與時代</div><h2>你代表這個家庭作決定</h2>'+familyHTML()+'<div class="panel"><h3>本次預計出發的是一名成年男子</h3><p>清治前期漢人渡臺移民以男性較多；攜眷限制、原鄉家庭分工與渡海風險，讓女性與孩子更難同行。但女性不是完全沒有渡臺。</p><p><b>家中的女性也有自己的意見：</b>「我也要維持收入、安排耕作和照顧家人。你走了，不能只把這些都留給我。」</p><p class="note">這是用來理解家庭分離的一種情境，不代表所有移民家庭。女性也可能是渡海者、勞動者或家庭決策者。</p></div>'+btn('開始家庭抉擇 →','decision(false)'),12)}
function decision(second){let descriptions=[['stay','留家相互照顧、繼續謀生；仍要面對田地、糧食或疾病的壓力。'],['apply','先申請；本課情境中由成年男子單獨出發。取得許可仍有船難與疾病風險。'],['secret','不經許可出發；除船難與疾病，還要面對查緝、受騙或船戶加害。']];show('<div class="eyebrow">'+(second?'03 / 消息之後':'02 / 第一次抉擇')+'</div><h2>'+(second?'你的想法改變了嗎？':'你會替這個家選哪條路？')+'</h2>'+(second?'<div class="feedback">'+event+'</div>':'<p>原鄉人口成長、耕地有限。臺灣可能有農耕與工作機會，但並不保證取得土地或致富。</p>')+'<details><summary>查看我的家庭</summary>'+familyHTML()+'</details><div class="choices" style="margin-top:20px">'+descriptions.map(([v,d])=>'<button class="choice" onclick="reason(\''+v+'\','+second+')"><b>'+labels[v]+'</b><span>'+d+'</span></button>').join('')+'</div>',second?35:22)}
function reason(v,second){route=v;answer=v==='stay'?['家人需要照顧，我想先留下。','家裡還能依靠田地、做工或親友維持。','我擔心出海後再也見不到家人。']:v==='apply'?['我想找新生計，也希望依規定辦理。','我願意等待，但要先安排留下家人的生活。','我想爭取機會，但知道獲准不等於平安。']:['生活壓力讓我覺得不能再等。','我找不到合適的合法渡臺途徑，仍想試一試。','我願意冒險，但擔心受騙、船難與被查獲。'];show('<span class="tag">'+labels[v]+'</span><h2>最接近你想法的理由是？</h2><div class="choices">'+answer.map((s,i)=>'<button class="choice" onclick="record('+second+','+i+')">'+s+'</button>').join('')+'</div><details><summary>查看我的家庭</summary>'+familyHTML()+'</details>',second?40:26)}
function record(second,i){history.push({route:labels[route],reason:answer[i]});if(second){riskGate();return}event=pick(['原鄉收成減少，存糧快要用完。家人問：「不去可能繼續挨餓，但你若回不來，我們怎麼辦？」','家中長者病倒，不能工作，還需要照顧。誰能留下？誰能維持收入？','親友介紹一份短工，暫時能增加收入，但不確定能做多久。','傳來一艘船遇難的消息，有人溺死，也有人失蹤。你無法知道親友下一次出海會不會平安。','有來信說：有人抵臺後發燒、生病，無法工作。原以為能寄回的錢，一直沒有寄到。']);show('<div class="eyebrow">新的消息</div><h2>生活並不照計畫走</h2><div class="panel"><p class="lead">'+event+'</p></div><p>可以改變決定；改變想法不扣分。</p>'+btn('再作一次決定 →','decision(true)'),30)}
function riskGate(){show('<div class="eyebrow">04 / 在結果揭曉之前</div><h2>先想清楚：代價可能是一條生命</h2><div class="grid"><div class="card"><h3>海上：未必回得來</h3><p>風浪與急流可能使船失事、翻覆，造成溺水死亡或失蹤。缺水、擁擠與身體虛弱也會增加旅途困難。偷渡者還可能遭船戶勒索或加害。</p></div><div class="card"><h3>上岸：不等於脫離危險</h3><p>移民還可能遇到瘧疾等疾病，或發燒、腹瀉等病況。當時醫療條件有限，生病可能使人無法工作，嚴重時甚至死亡。</p></div></div><div class="feedback"><b>家人的聲音：</b>「如果你失蹤、病倒或死亡，船資與債務不會消失。留鄉的我們也要繼續找食物、照顧老人和孩子。」</div><p>這些危險不是靠勇敢、勤勞或選對答案就能完全避免。申請獲准也沒有平安保證。</p><p class="note">沒有足夠依據設定統一死亡率。抽到事件的次數不代表史實比例，俗諺也不是死亡統計。</p><div class="actions">'+btn(route==='stay'?'維持留鄉，看看後續 →':'我知道了，仍選擇'+labels[route]+' →','proceed()')+(route==='stay'?'':btn('改為留鄉，重新安排生計','changeStay()',true))+'</div>',48)}
function changeStay(){route='stay';history.push({route:labels.stay,reason:'重新考慮死亡、疾病與家人負擔後，決定留下。'});proceed()}
function proceed(){if(route==='stay'){outcome=pick(['你留鄉找到短工，家庭暫時能相互照顧；收入仍有限，也沒有更多田地。','你留鄉後遇到家人生病，工作和照顧兩頭忙，糧食與收入壓力仍在。']);familyImpact='留下能相互照顧，但不能自動解決貧困與疾病。家庭需要共同分擔收入、農務和照顧責任。';ending();return}if(route==='apply'){let status=pick(['granted','granted','waiting']);if(status==='waiting'){outcome='申請仍在等待，還沒有出海。家裡的資源持續消耗，你需要一邊找生計，一邊等待消息。';familyImpact='等待也有代價；家人要繼續安排耕作、做工與照顧。';ending();return}}departed=true;voyage()}
const seaCards=[{name:'風浪中抵岸',text:'船隻在風浪中顛簸。你十分疲累，最後仍平安抵岸。這次平安並不表示出海沒有危險。',state:'landed'},{name:'缺水與病痛',text:'航程耽擱，船上飲水不足，你又不斷嘔吐、身體虛弱。勉強抵岸後，你沒有力氣立刻工作。',state:'landed'},{name:'船難：失蹤',text:'風浪使船隻失事，這位預計為家庭尋找生計的男子失蹤。家人等不到確切消息，無法知道他是否還活著。',state:'missing'},{name:'船難：死亡',text:'船隻遭遇風浪失事。這位出發的男子落海溺水死亡，再也無法與家人相見。這是無法挽回的損失，不是玩家答錯題的懲罰。',state:'dead'}];
function voyage(){let cards=route==='secret'?seaCards.concat([{name:'遭到查獲',text:'你在偷渡途中遭官府查獲，計畫中止，面臨處罰或遣返。家裡已付出的費用未必能取回。',state:'stopped'},{name:'船戶勒索',text:'船戶途中索取額外費用。你失去部分盤纏才抵岸，接下來的食宿與生計更加困難。',state:'landed'}]):seaCards;let card=pick(cards);journey.push('渡海｜'+card.name+'：'+card.text);show('<div class="eyebrow">05 / 航程事件 · '+labels[route]+'</div><h2>'+card.name+'</h2><div class="panel"><p class="lead">'+card.text+'</p></div><div class="feedback">不論是否取得許可，都可能遭遇海難。這張隨機事件卡不是實際發生機率；也不能把事故歸咎於不夠努力。</div>'+btn(card.state==='landed'?'抵臺之後，還有什麼？ →':'從家人的角度繼續 →',"afterSea('"+card.state+"')"),60)}
function afterSea(state){if(state==='landed'){illness();return}outcome=journey[journey.length-1];familyImpact=state==='dead'?'親人死亡讓家庭失去重要成員。悲傷之外，家人還要共同承擔債務、收入、農務與照顧責任。女性和孩子也受到這次遷移的深刻影響。':state==='missing'?'家人長期等待消息，不知道該繼續等、尋人，或如何維持生活。希望、擔心與經濟壓力同時存在。':'出發計畫中止，家庭仍要面對生計與已支出的船資。';ending()}
function illness(){show('<div class="eyebrow">06 / 抵臺以後</div><h2>上岸了，卻病倒了</h2><div class="panel"><p class="lead">抵臺一段時間後，你發燒、虛弱，幾乎無法做工。盤纏還要支付食宿，原鄉家人卻等著你的消息和收入。</p><p>當時移民面對包括瘧疾在內的疾病威脅，醫療與照顧資源有限。這段故事不能只靠症狀確定疾病。</p></div><h3>你最擔心什麼？</h3><div class="choices">'+['找不到照顧與醫療協助，病情可能惡化。','無法工作就沒有收入，家裡也可能收不到錢。','家人在遠方，無法知道我的病況，也難以照顧我。'].map((s,i)=>'<button class="choice" onclick="illnessOutcome('+i+')">'+s+'</button>').join('')+'</div><p class="note">三個擔心都有道理。這不是醫療答題，也不會因選哪項就保證痊癒。</p>',69)}
function illnessOutcome(i){const worries=['缺乏照顧與醫療協助','中斷收入及家人的生計','與家人分隔、消息不通'];journey.push('病倒時最擔心｜'+worries[i]);let health=pick([{name:'病後仍需休養',text:'得到一些照顧後，病況漸漸緩和，但你仍不能立刻工作。盤纏減少，原先的開墾計畫必須延後。'},{name:'長時間無法工作',text:'病情反覆，你長時間無法工作。食宿和照顧都需要資源，原鄉家人也遲遲收不到預期收入。'},{name:'病重死亡',text:'病情持續惡化，這位出發的男子最後因病死亡。抵岸並沒有保證他能活下來；家人失去親人，也失去原先期待的團聚。'}]);journey.push('抵臺後｜'+health.name+'：'+health.text);outcome=health.text;familyImpact=health.name==='病重死亡'?'家人承受失去親人的悲傷，也要重新安排生計與照顧。這是生命與家庭的損失，不能用輸贏分數衡量。':'等待收入的家人必須另找生計、安排照顧。渡臺者的病痛，同時影響留鄉者。';ending()}
function ending(){show('<div class="eyebrow">07 / 家庭的後續</div><h2>一個人的遭遇，牽動整個家</h2><span class="tag">'+labels[route]+'</span><div class="panel"><p class="lead">'+outcome+'</p><h3>留鄉家人的處境</h3><p>'+familyImpact+'</p></div><p>你仍可完成學習回顧。死亡與失蹤不是「淘汰」，也不代表當初的決定不值得理解。</p><div class="feedback">本次故事只呈現一種可能。留鄉、合法渡臺與偷渡都可能有代價；不能用一次抽卡推算整段歷史的風險。</div>'+btn('完成三題小挑戰 →','quiz()'),78)}
const questions=[{q:'為什麼有人明知渡海可能死亡，仍考慮出發？',a:['原鄉生計壓力與對臺灣機會的期待，使人面臨兩難。','因為去臺灣一定能拿到土地。','因為當時的人都不重視生命。'],ok:0,ex:'理解移民，需要同時看到原鄉的困難、家庭責任與對新生計的期待。冒險不等於不知道危險。'},{q:'關於清治前期的女性，哪個說法較恰當？',a:['當時臺灣沒有女性。','漢人女性移民較男性少，但並非沒有；留鄉女性也承擔勞動、照顧與決策。','所有女性都不能渡臺，整個清代從未改變。'],ok:1,ex:'漢人女性移民較少，並非完全沒有。政策與執行曾變動；原住民族女性原本就在臺灣，不能被忽略。'},{q:'獲准渡臺並平安上岸，是否就安全了？',a:['是，只要勤勞就一定不會生病。','否，仍可能遭疾病、無法工作或死亡；海上也不因有許可就沒有危險。','是，疾病只會發生在偷渡者身上。'],ok:1,ex:'法律許可與自然、健康風險是不同層面的事。抵臺不是終點，留鄉家人也可能持續承受後果。'}];
function quiz(){let q=questions[quizIndex];show('<div class="eyebrow">08 / 課本小挑戰 '+(quizIndex+1)+' / '+questions.length+'</div><h2>'+q.q+'</h2><div class="choices">'+q.a.map((s,i)=>'<button class="choice" onclick="check('+i+')">'+s+'</button>').join('')+'</div>',82+quizIndex*4)}
function check(i){let q=questions[quizIndex];quizResults.push(i===q.ok);show('<h2>'+(i===q.ok?'你掌握了這個重點！':'再從家庭與時代想一想')+'</h2><div class="feedback">'+q.ex+'</div><p>較合適的回答：'+q.a[q.ok]+'</p>'+btn(quizIndex<questions.length-1?'下一題 →':'查看我的選擇回顧 →','nextQuiz()'),85+quizIndex*4)}
function nextQuiz(){quizIndex++;quizIndex<questions.length?quiz():report()}
function report(){show('<div class="eyebrow">完成 / 第二版學習回顧</div><h2>生計、生命與分離的代價</h2>'+familyHTML()+'<div class="panel"><h3>你的決策足跡</h3>'+history.map((h,i)=>'<p><b>第'+(i+1)+'次：'+h.route+'</b><br>'+h.reason+'</p>').join('')+'<p><b>改變情境的消息：</b>'+event+'</p>'+journey.map(s=>'<p>'+s+'</p>').join('')+'<p><b>最後情況：</b>'+outcome+'</p><p><b>留鄉家人：</b>'+familyImpact+'</p></div><div class="feedback">已完成'+questions.length+'題，首次答對'+quizResults.filter(Boolean).length+'題。家庭決策不計分；生命不能用輸贏計算。</div><p><b>帶走一個想法：</b>「為了讓家人活得下去，是否願意冒著再也見不到家人的危險？」女性、孩子與長者也會承受遷移的後果；留鄉的人並非只是等待。</p><p>臺灣並非無主之地，取得耕地涉及原住民族既有的生活領域與權利。清代不同時期的遷移情況也不能全部用同一種家庭故事解釋。</p><div class="actions">'+btn('列印／存成PDF','window.print()')+btn('下載我的回顧','download()',true)+btn('重新體驗','intro()',true)+'</div>'+sources(),100)}
function download(){let text='這個家，要不要過臺灣？第二版\n\n'+family.map(f=>f.join('：')).join('\n')+'\n\n'+history.map((h,i)=>(i+1)+'. '+h.route+'：'+h.reason).join('\n')+'\n變化：'+event+'\n'+journey.join('\n')+'\n結果：'+outcome+'\n留鄉家人：'+familyImpact+'\n\n隨機事件為教學模擬，不代表歷史機率。';let u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='我的渡臺選擇回顧.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function teacher(){let d=document.createElement('dialog');d.style.cssText='max-width:700px;border:0;border-radius:20px;padding:30px;color:#183c3b;max-height:85vh;overflow:auto';d.innerHTML='<h2>第二版｜教師快速說明</h2><p>約7～10分鐘，個別點選。新增出發前死亡與疾病風險、海難死亡／失蹤、抵臺後疾病與家庭後果。採非血腥文字；事件不作輸贏評分，任何結局都能完成知識題。</p><p>本次以成年男子考慮渡臺、其他家人留鄉為情境。清治前期漢人女性移民較少，並非無女性渡臺；女性也是勞動與家庭決策者。不同時期政策與執行曾變動。</p><p><b>抽卡不是死亡率：</b>所有學生出發前都會閱讀生命風險；實際事件隨機呈現。不可依抽卡次數推估史實比例，也不以俗諺設定百分比。疾病關卡為教學上刻意聚焦的情境，不代表抵臺者必然生病。</p><p>留鄉也有貧困與疾病壓力。遊戲不暗示留鄉保證安全、合法渡臺保證安全，或努力就能避免事故。支持與醫療不能被寫成保證治癒的按鈕。</p><p>完成後可截圖或下載回顧交至既有班級平台。不收集姓名、不自動傳送作答，重新整理會重設進度。</p>'+sources()+btn('回到遊戲','this.closest(\'dialog\').close()');d.addEventListener('close',()=>d.remove());document.body.appendChild(d);d.showModal()}
intro();
